<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; background-color: #f1f5f9;">
  <div class="admin-card" style="max-width: 400px; width: 100%;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 900; margin: 0; color: #1e293b;">Asthma Admin</h1>
      <p style="color: #64748b; font-weight: 500; margin-top: 0.5rem;">Panel de Control Profesional</p>
    </div>

    <form (submit)="onLogin()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input [(ngModel)]="email" name="email" type="email" placeholder="ejemplo@correo.com" class="form-input">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" class="form-input" style="padding-right: 45px;">
          <button type="button" (click)="togglePassword()" class="password-toggle" title="Mostrar/Ocultar contraseña">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <div *ngIf="error" style="background: #fef2f2; border: 1px solid #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.75rem; margin-bottom: 1.25rem; font-size: 0.875rem;">
        {{ error }}
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-primary">
        {{ isLoading ? 'Cargando...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>
