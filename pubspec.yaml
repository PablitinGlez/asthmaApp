name: asthmaapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.1
  dio: ^5.4.0
  go_router: ^14.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.5.1
  flutter_svg: ^2.0.10
  flutter_colorpicker: ^1.1.0
  loading_animation_widget: ^1.3.0
  animate_do: ^4.2.0
  liquid_swipe: ^3.1.0
  toastification: ^3.0.3
  fl_chart: ^1.1.1
  vibration: ^3.1.3
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  tutorial_coach_mark: ^1.3.3
  visibility_detector: ^0.4.0+2
  flutter_speed_dial: ^7.0.0
  sticky_headers: ^0.3.0+2
  flutter_sticky_header: ^0.8.0
  firebase_messaging: ^15.2.10
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  avatar_glow: ^3.0.1
  flutter_blue_plus: ^2.1.1
  health: ^13.3.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  supabase_flutter: ^2.12.0
  pinput: ^6.0.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/personajes/
    - assets/charts/

  
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/sans/GeneralSans-Regular.otf
        - asset: assets/fonts/sans/GeneralSans-Bold.otf
          weight: 700
