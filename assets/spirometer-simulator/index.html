<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Espirómetro - AsthmaApp</title>
    <!-- Usaremos la fuente "Inter" para un diseño moderno y médico -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="simulation-container">
        <!-- Encabezado con logo o icono simulado -->
        <header class="app-header">
            <div class="icon-pulsing"></div>
            <h1>Simulador Clínico (PEF)</h1>
            <p>Herramienta para inyección de datos Bluetooth simulados a FastAPI</p>
        </header>

        <!-- Formulario Principal -->
        <main class="card">
            <form id="spirometerForm">

                <div class="form-group">
                    <label for="patientEmail">Identificador del Paciente (Correo)</label>
                    <input type="email" id="patientEmail" placeholder="ejemplo@paciente.com" required>
                </div>

                <div class="form-row">
                    <!-- Valores Calculados Automáticamente o Manuales -->
                    <div class="form-group">
                        <label for="pefValue">PEF (L/min)</label>
                        <input type="number" id="pefValue" class="generated-input" placeholder="0" readonly>
                    </div>

                    <div class="form-group">
                        <label for="fev1Value">FEV1 (Litros)</label>
                        <input type="number" step="0.1" id="fev1Value" class="generated-input" placeholder="0.0"
                            readonly>
                    </div>

                    <div class="form-group">
                        <label for="fvcValue">FVC (Litros)</label>
                        <input type="number" step="0.1" id="fvcValue" class="generated-input" placeholder="0.0"
                            readonly>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" id="btnGenerate" class="btn-secondary">Aleatorizar Valores</button>
                    <!-- Alerta de Severidad -->
                    <span id="severityBadge" class="badge hidden">Leve</span>
                </div>

            </form>

            <hr class="divider">

            <div class="api-target">
                <label>Objetivo de API (FastAPI - Render)</label>
                <input type="url" id="apiUrl"
                    value="https://asthma-predictor-api.onrender.com/api/measurements/spirometer/simulate" required>
                <small>Modifica este URL si estás probando en localhost (ej: http://127.0.0.1:8000/...)</small>
            </div>

            <button type="button" id="btnSubmit" class="btn-primary" disabled>Emitir Soplido (POST)</button>
        </main>

        <!-- Consola de Logs (Para impresionar a los profesores) -->
        <footer class="console-box">
            <div class="console-header">Terminal de Salida</div>
            <div id="consoleOutput" class="console-content">
                <span class="log-info">> Esperando conexión con el hardware...</span>
                <span class="log-info">> Listo para simular mediciones.</span>
            </div>
        </footer>
    </div>

    <!-- Archivo JS con la lógica -->
    <script src="app.js"></script>
</body>

</html>
